services:
  - type: web
    name: reva-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APISPERU_TOKEN
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MODO_DEMOSTRACION
        value: "true"

  - type: web
    name: reva-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/reva-frontend/browser
    envVars:
      - key: REVA_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
